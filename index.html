<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>小睿闆的冒險教室</title>
<meta name="theme-color" content="#ffcf6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冒險教室">
<style>
:root{--bg:#fff6e3;--ink:#4a3424;--orange:#ff9f43;--green:#2ecc71;--blue:#4d9de0;--pink:#ff6b9a;--purple:#9b6dff;--yellow:#ffd93d;--teal:#1fbfb8;--red:#ff5e57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.topbar h1{flex:0 1 auto;font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.back{border:none;background:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:0 4px 0 #ead8bd;flex:none}
.starpill{white-space:nowrap;flex:none;margin-left:auto;background:#fff;border-radius:99px;padding:7px 14px;font-weight:900;font-size:18px;box-shadow:0 3px 0 #ead8bd}
.mini-rui{width:54px;height:62px;position:relative;flex:none}
/* 小睿闆：3D 載入前先用畫的 */
.rui-host{position:relative}
.rui-host .rui-svg{width:100%;height:100%;display:block}
.rui-host.has3d .rui-svg{display:none}
.rui-host canvas.rui3d{position:absolute;inset:0;width:100%!important;height:100%!important}
/* 首頁 */
.hero{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
.hero .rui-host{width:120px;height:140px;flex:none}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;font-size:19px;font-weight:800;line-height:1.45;position:relative;box-shadow:0 4px 0 #ead8bd;flex:1}
.bubble::before{content:"";position:absolute;left:-10px;top:40%;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble small{display:block;font-size:14px;font-weight:600;opacity:.75;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;padding:8px 16px 0;flex-wrap:wrap}
.seg{display:flex;background:#fff;border-radius:99px;padding:4px;box-shadow:0 3px 0 #ead8bd}
.seg button{border:none;background:none;padding:7px 14px;border-radius:99px;font-weight:800;font-size:16px}
.seg button.on{background:var(--orange);color:#fff}
.chip{border:none;background:#fff;border-radius:99px;padding:9px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #ead8bd}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 24px;overflow:auto;flex:1;align-content:start}
@media (min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}}
@media (min-width:720px) and (min-height:800px){.cards{grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:30px 10px;font-size:24px}.card .ic{font-size:62px}.card small{font-size:15px}.hero .rui-host{width:170px;height:200px}.bubble{font-size:24px}}
.card{border:none;border-radius:24px;padding:14px 10px;font-size:19px;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.card .ic{font-size:42px;line-height:1.1}
.card small{font-weight:700;opacity:.92;font-size:13px}
.card:active,.tool:active,.choice:active,.coin:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.badge{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:99px;font-size:13px;padding:2px 8px;display:none;text-shadow:none}
.badge.show{display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
/* 遊戲共用 */
.game-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:6px 14px 14px;overflow:auto;min-height:0}
.question{font-size:clamp(30px,8vw,56px);font-weight:900;background:#fff;border-radius:24px;padding:8px 26px;box-shadow:0 5px 0 #ead8bd;text-align:center}
.question.small{font-size:clamp(22px,5.5vw,36px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tool{border:none;border-radius:16px;padding:10px 16px;font-size:17px;font-weight:900;background:#fff;box-shadow:0 4px 0 #ead8bd}
.tool.hint{background:var(--yellow)}
.tip{margin:0;font-weight:700;opacity:.7}
.prog{white-space:nowrap;flex:none;font-weight:900;background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 3px 0 #ead8bd}
/* 打地鼠 */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,470px,calc((100dvh - 290px)*1.15))}
.hole{position:relative;aspect-ratio:1.15;overflow:hidden}
.hole::before{content:"";position:absolute;left:6%;right:6%;bottom:8%;height:30%;background:#5d3d20;border-radius:50%;z-index:0}
.hole::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:#7cc24a;border-radius:40% 40% 14px 14px;z-index:2}
.mole{position:absolute;left:17%;right:17%;bottom:14%;height:74%;z-index:1;transform:translateY(125%);transition:transform .22s ease-out;background:#b07a45;border-radius:50% 50% 34% 34%;border:none;padding:0}
.mole.up{transform:translateY(0)}
.mole .eye{position:absolute;top:18%;width:12%;height:13%;background:#2b1a0e;border-radius:50%}
.mole .eye.l{left:28%}.mole .eye.r{right:28%}
.mole .nose{position:absolute;top:31%;left:50%;width:16%;height:10%;margin-left:-8%;background:#ff8fa3;border-radius:50%}
.mole .num{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:1px 9px;font-weight:900;font-size:clamp(18px,5vw,30px);color:var(--ink);white-space:nowrap}
.mole.bonk{animation:bonk .45s}
@keyframes bonk{30%{transform:translateY(10%) scaleY(.75)}100%{transform:translateY(125%)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
/* 時鐘 */
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.clockbtn{background:#fff;border:none;border-radius:24px;padding:8px;width:min(28vw,180px,calc(100dvh - 270px));box-shadow:0 5px 0 #ead8bd}
.clockbtn svg{width:100%;display:block}
/* 認字、英文 */
.bigemoji{font-size:clamp(64px,20vw,120px);line-height:1.1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
@media (max-height:600px){.bigemoji{font-size:64px}.tip{display:none}.question{padding:4px 22px}}
.choice{border:none;background:#fff;border-radius:20px;padding:12px 20px;min-width:110px;font-size:clamp(24px,6vw,36px);font-weight:900;box-shadow:0 5px 0 #ead8bd;display:flex;flex-direction:column;align-items:center}
.choice small{font-size:15px;font-weight:700;color:var(--purple);letter-spacing:1px}
.choice.en{font-family:"Avenir Next","Arial Rounded MT Bold",system-ui,sans-serif;text-transform:lowercase}
.choice.emo{font-size:clamp(44px,12vw,70px);padding:8px 18px}
.reveal{min-height:30px;font-size:22px;font-weight:900;color:var(--green)}
.listen{border:none;background:var(--blue);color:#fff;border-radius:50%;width:110px;height:110px;font-size:50px;box-shadow:0 6px 0 #2f79b8}
/* 商店 */
.shopitem{background:#fff;border-radius:24px;padding:8px 22px;box-shadow:0 5px 0 #ead8bd;display:flex;align-items:center;gap:14px}
.shopitem .bigemoji{font-size:64px}
.price{font-size:30px;font-weight:900;color:var(--red)}
.tray{width:min(92vw,520px);min-height:84px;background:#fff3c4;border:3px dashed #e9b949;border-radius:20px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-items:center;justify-content:center}
.trayhint{opacity:.55;font-weight:800}
.total{font-size:20px;font-weight:900}
.bank{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.coin{border:none;border-radius:50%;width:66px;height:66px;font-size:22px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.tray .coin{width:50px;height:50px;font-size:17px}
.c1{background:#e8a86b;color:#5a3010}.c5{background:#d9dde3}.c10{background:#c9cdd4;border:4px solid #e2b85a!important}.c50{background:#f3c94f;color:#6b4800}
.paybtn{border:none;background:var(--green);color:#fff;border-radius:18px;padding:12px 30px;font-size:22px;font-weight:900;box-shadow:0 5px 0 #20a65a}
/* 白板 */
.btools{display:flex;gap:7px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ddd;flex:none}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.bbtn{border:none;background:#fff;border-radius:14px;padding:8px 11px;font-size:16px;font-weight:900;box-shadow:0 3px 0 #ead8bd}
.bbtn.on{background:var(--ink);color:#fff}
.bbtn.ask{background:var(--pink);color:#fff;box-shadow:0 3px 0 #d94b7a;font-size:17px}
.bbtn.q{background:var(--blue);color:#fff;box-shadow:0 3px 0 #2f79b8}
.board-wrap{flex:1;position:relative;margin:0 10px 10px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 0 #ead8bd;min-height:0}
.board-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hintCv{pointer-events:none}
.hintpanel{position:absolute;left:10px;right:10px;bottom:10px;background:#fffbe8;border:3px solid var(--yellow);border-radius:18px;padding:10px 12px;display:none;gap:10px;align-items:center;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.hintpanel.show{display:flex}
.hintpanel #hintText{flex:1;font-size:19px;font-weight:800;line-height:1.4}
.hintpanel button{border:none;border-radius:12px;padding:8px 12px;font-weight:900;font-size:16px;background:#fff;box-shadow:0 3px 0 #ead8bd;flex:none}
.hintpanel .hn{background:var(--orange);color:#fff}
/* 貼紙本 */
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 16px 24px;overflow:auto;align-content:start;flex:1}
@media (min-width:720px){.stickers{grid-template-columns:repeat(8,1fr)}}
.stk{aspect-ratio:1;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 0 #ead8bd}
.stk.lock{font-size:22px;color:#c9b79c;background:#fbf1df}
/* 信箱 */
.mail{flex:1;overflow:auto;padding:6px 14px 24px;display:flex;flex-direction:column;gap:12px}
.mcard{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 0 #ead8bd;display:flex;flex-direction:column;gap:8px}
.mcard .when{font-size:13px;opacity:.6;font-weight:700}
.mcard img{max-width:100%;max-height:240px;border-radius:12px;border:2px solid #f1e3cc;align-self:flex-start;object-fit:contain;background:#fff}
.mcard .qtext{font-size:18px;font-weight:800}
.mcard audio{width:100%;max-width:360px}
.answer{background:#e9f8ef;border-radius:14px;padding:10px;font-weight:800;font-size:18px}
.answer b{color:#1f9d55}
.dadbox{border-top:2px dashed #eee;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;opacity:.6;font-weight:800;margin-top:40px;line-height:1.7}
textarea,input[type=text],input[type=number]{font-family:inherit;font-size:18px;border:2px solid #ead8bd;border-radius:14px;padding:10px;width:100%;-webkit-user-select:text;user-select:text}
/* 彈窗 */
.modal-back{position:fixed;inset:0;background:rgba(60,40,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-back.show{display:flex}
.modal{background:#fff;border-radius:26px;padding:20px;width:min(540px,100%);max-height:92dvh;overflow:auto;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{margin:4px 0 10px;font-size:24px}
.modal p{font-size:18px;font-weight:700;line-height:1.55;margin:8px 0}
.modal .big{font-size:60px}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mbtn{border:none;border-radius:18px;padding:14px;font-size:20px;font-weight:900;background:var(--orange);color:#fff;box-shadow:0 5px 0 #d97e22}
.mbtn.alt{background:#f3ebe0;color:var(--ink);box-shadow:0 5px 0 #e0d2bd}
.mbtn.blue{background:var(--blue);box-shadow:0 5px 0 #2f79b8}
.mbtn.pink{background:var(--pink);box-shadow:0 5px 0 #d94b7a}
.mbtn.green{background:var(--green);box-shadow:0 5px 0 #20a65a}
.mbtn.red{background:#fff;color:var(--red);box-shadow:0 3px 0 #f0d0cc;font-size:16px;padding:10px}
.mic{border:none;border-radius:99px;padding:16px 26px;font-size:22px;font-weight:900;background:var(--pink);color:#fff;box-shadow:0 5px 0 #d94b7a}
.mic.recording{background:var(--red);animation:pulse 1s infinite}
.small{font-size:14px!important;opacity:.7}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block}
.dot.r{background:var(--red)}.dot.b{background:var(--blue)}.dot.g{background:var(--green)}
.dot.x{background:#ddd;position:relative}.dot.x::after{content:"✕";position:absolute;inset:0;font-size:16px;line-height:22px;color:var(--red);font-weight:900}
.gap{width:10px}
.grp{display:flex;gap:4px;padding:6px;border:2px dashed #ffc36b;border-radius:12px}
.hintbig{font-size:34px!important;font-weight:900;color:var(--purple);letter-spacing:2px}
.peek{border:none;background:var(--yellow);border-radius:10px;padding:4px 12px;font-weight:900;font-size:18px}
.conf{position:fixed;font-size:28px;pointer-events:none;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media (max-width:480px){.btools{gap:5px;padding:6px 8px}.btools .back{width:40px;height:40px}.sw{width:28px;height:28px}.bbtn{padding:7px 8px;font-size:14px}.bbtn.ask{font-size:15px}.hintpanel{flex-wrap:wrap}.hintpanel #hintText{flex-basis:100%}}
.choice.right{background:#d4f7e2!important;box-shadow:0 5px 0 #8fd9ad}
.choice.no{opacity:.4}
.choice.clockbtn{min-width:0;padding:8px}
.choice.txt{font-size:clamp(17px,4.6vw,22px);width:min(92vw,560px);padding:12px 16px}
.choice.en-s{font-family:"Avenir Next",system-ui,sans-serif;text-transform:none}
.choice.zy{font-size:clamp(20px,5vw,28px);letter-spacing:2px}
.choices.col{flex-direction:column;align-items:center;flex-wrap:nowrap}
.explain{display:flex;flex-direction:column;align-items:center;gap:10px}
.explain:empty{display:none}
.know{background:#e9f8ef;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.6;max-width:620px;text-align:left}
.wp{background:#fff;border-radius:20px;padding:14px 18px;font-size:clamp(19px,4.8vw,24px);font-weight:800;line-height:1.6;max-width:640px;box-shadow:0 5px 0 #ead8bd}
.wp.en-q{font-family:"Avenir Next",system-ui,sans-serif;font-size:clamp(22px,5.5vw,30px)}
.clockbig{width:min(46vw,190px,calc(100dvh - 400px));min-width:120px}
.clockbig svg{width:100%;display:block}
.countbox{font-size:clamp(28px,7vw,40px);max-width:min(92vw,520px);text-align:center;line-height:1.3;word-break:break-all}
.spell{font-family:"Avenir Next","Arial Rounded MT Bold",sans-serif;font-size:clamp(40px,11vw,60px);font-weight:800;letter-spacing:6px}
.spell .blank{color:var(--pink)}
.coin.bill{border-radius:10px;width:92px;height:52px}
.tray .coin.bill{width:70px;height:40px}
.b100{background:#ef9aa5;color:#6b1622}.b500{background:#d9a066;color:#5a3010}.b1000{background:#8fb4e3;color:#123d6b}
.sec{grid-column:1/-1;font-size:18px;font-weight:900;margin:6px 2px -4px;opacity:.8}
.seg button{padding:7px 11px}
.idiom{font-size:clamp(40px,11vw,64px);font-weight:900;letter-spacing:6px;font-family:"Kaiti TC","BiauKai","PingFang TC",serif}
.idiom .blank,.spell .blank{color:var(--pink)}
.passage{background:#fffdf5;border:3px solid #f1dfb8;border-radius:18px;padding:12px 16px;font-size:clamp(17px,4.4vw,21px);font-weight:700;line-height:1.75;max-width:640px;text-align:left}
.speedbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.speedbar span{background:#fff;border-radius:99px;padding:6px 14px;font-weight:900;font-size:18px;box-shadow:0 3px 0 #ead8bd}
.ansbox{min-width:160px;min-height:58px;background:#fff;border:3px dashed #ffc36b;border-radius:16px;font-size:38px;font-weight:900;text-align:center;padding:2px 14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(86vw,330px)}
.pk{border:none;background:#fff;border-radius:14px;font-size:24px;font-weight:900;padding:10px 0;box-shadow:0 4px 0 #ead8bd}
.pk:active{transform:translateY(3px);box-shadow:0 1px 0 #ead8bd}
.sdk{display:grid;width:min(90vw,400px,calc(100dvh - 330px));min-width:240px;aspect-ratio:1;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.sc{border:1px solid #d9c9b0;background:#fff;font-size:clamp(20px,6vw,32px);font-weight:900;color:var(--blue);padding:0}
.sc.given{color:var(--ink);background:#f6efe3}
.sc.sel{background:#fff3c4}
.sc.bad{color:var(--red);background:#ffe1df}
.sc.hinted{background:#fff1a8}
.sc.br{border-right:3px solid var(--ink)}
.sc.bb{border-bottom:3px solid var(--ink)}
.sdkpad{width:min(92vw,420px)}
.mem{display:grid;gap:8px;width:min(92vw,460px,calc((100dvh - 280px)*1.1))}
.mc{aspect-ratio:1;border:none;border-radius:14px;background:linear-gradient(135deg,#ff9fc4,#9b6dff);box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:clamp(14px,4vw,22px);font-weight:900;padding:2px;position:relative;color:var(--ink)}
.mc .face{display:none;word-break:break-all;line-height:1.2}
.mc .back{font-size:26px}
.mc.up,.mc.ok,.mc.peek{background:#fff}
.mc.up .face,.mc.ok .face,.mc.peek .face{display:block}
.mc.up .back,.mc.ok .back,.mc.peek .back{display:none}
.mc.ok{background:#d4f7e2;opacity:.75}
.built{min-height:56px;width:min(92vw,560px);background:#fff;border:3px dashed #9be3df;border-radius:16px;padding:10px;font-family:"Avenir Next",system-ui,sans-serif;font-size:24px;font-weight:800;text-align:center}
.bw{display:inline-block;margin:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip-w{border:none;background:var(--teal);color:#fff;border-radius:14px;padding:10px 16px;font-family:"Avenir Next",system-ui,sans-serif;font-size:22px;font-weight:800;box-shadow:0 4px 0 #15948f}
.chip-w:disabled{opacity:.25}
.clockpair{display:flex;align-items:center;gap:10px;font-size:30px}
.clockpair div{width:min(36vw,150px,calc(100dvh - 420px));min-width:100px}
.clockpair svg{width:100%;display:block}
.shoprow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.zoomimg{max-width:100%;max-height:70dvh;border-radius:12px}
</style>
</head>
<body>

<!-- 首頁 -->
<section class="screen active" id="home">
  <div class="hero">
    <div class="rui-host" id="homeRui"></div>
    <div class="bubble" id="greet">小睿闆，今天想玩什麼？<small>每拿 5 顆星就送一張貼紙喔！</small></div>
  </div>
  <div class="row">
    <div class="seg" id="gradeSeg"><button data-g="1">一年級</button><button data-g="2">二年級</button><button data-g="3">挑戰🔥</button><button data-g="4">資優🏆</button></div>
    <span class="starpill" id="homeStars">⭐ 0</span>
  </div>
  <div class="cards">
    <div class="sec">🔢 數學</div>

<script type="module">

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 存檔 ---------- */
const KEY = 'xr-learn-v1';
const S = Object.assign({ grade: 1, stars: 0, stickers: 0, mailSeen: 0 }, JSON.parse(localStorage.getItem(KEY) || '{}'));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
if (S.v !== 2) { S.v = 2; S.grade = 4; save(); } // 2026-11-22 起預設資優
const STICKERS = ['🦖','🚀','🐬','🦁','🍩','🏎️','🐙','🦄','⚽','🐲','🍕','🛸','🐳','🎸','🦊','🏰','🐝','🌋','🤖','🦉','🍔','🚁','🐢','👑','🦈','🎡','🐧','🏆','🦕','🛰️','🧙','🦩','🐉','🎯','🧩','🦚','🪐','🦭','🏄','🎹','🦜','🌠','💎','🥇'];
function addStar() {
  S.stars++;

}
function paintStars() {

/* ---------- 聲音 ---------- */
let zhVoice = null, enVoice = null;
function pickVoices() {
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
  enVoice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google|Female/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}

    speechSynthesis.speak(u);
  } catch (e) {}
}
const say = t => speak(t.replace(/−/g, '減').replace(/\+/g, '加').replace(/×/g, '乘以'), 'zh-TW');
const sayEn = t => speak(t, 'en-US');
let ac;
function beep(type) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = type === 'ok' ? [660, 880, 1320] : type === 'bad' ? [320, 230] : [600];

      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .09;

}
function confetti() {
  for (let i = 0; i < 16; i++) {

    s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'vw');
    s.style.setProperty('--dy', (-Math.random() * 40 - 8) + 'vh');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1150);
  }
}

/* ---------- 小睿闆（3D 載入前的畫像） ---------- */
const RUI_SVG = `<svg class="rui-svg" viewBox="0 0 120 140"><circle cx="20" cy="68" r="8" fill="#f6cfaa"/><circle cx="100" cy="68" r="8" fill="#f6cfaa"/><circle cx="60" cy="66" r="42" fill="#ffdcbc"/><path d="M18 60Q20 20 60 20Q100 20 102 60Q92 40 74 42Q66 32 56 40Q40 36 30 48Q22 52 18 60Z" fill="#2b2b2b"/><ellipse cx="45" cy="64" rx="5" ry="6" fill="#2b2b2b"/><ellipse cx="75" cy="64" rx="5" ry="6" fill="#2b2b2b"/><circle cx="47" cy="62" r="1.6" fill="#fff"/><circle cx="77" cy="62" r="1.6" fill="#fff"/><ellipse cx="35" cy="78" rx="7" ry="4" fill="#ffaaa6" opacity=".6"/><ellipse cx="85" cy="78" rx="7" ry="4" fill="#ffaaa6" opacity=".6"/><path d="M47 80Q60 95 73 80Z" fill="#fff" stroke="#8a4a35" stroke-width="3" stroke-linejoin="round"/><path d="M40 85q2 3 4 0M76 85q2 3 4 0" stroke="#d38f6e" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="34" y="106" width="52" height="34" rx="14" fill="#4d9de0"/></svg>`;
$$('.rui-host').forEach(h => h.innerHTML = RUI_SVG);
initRui('./assets/rui-game.glb?v=20261115-rui-cheeks2');
attachRui($('#homeRui'));
$('#homeRui').addEventListener('click', () => { helloRui(); say('嗨！我是小睿闆，一起來冒險吧！'); });

/* ---------- 換畫面 ---------- */
let G = { timer: null };
function show(id) {

}

$$('[data-go]').forEach(b => b.onclick = () => {

$$('#gradeSeg button').forEach(b => b.onclick = () => { S.grade = +b.dataset.g; save(); paintGrade(); say(['', '一年級模式', '二年級模式', '挑戰模式！題目會很難喔', '資優模式！準備好動腦了嗎？'][S.grade]); });

/* ---------- 彈窗 ---------- */
let curRec = null;
function openModal(html) { $('#md').innerHTML = html; $('#mb').classList.add('show'); return $('#md'); }
function closeModal() { if (curRec) { curRec.stop(); curRec = null; } $('#mb').classList.remove('show'); }
$('#mb').addEventListener('click', e => { if (e.target.id === 'mb') closeModal(); });
$('#md').addEventListener('click', e => {
  const p = e.target.closest('.peek'); if (p) { p.textContent = p.dataset.a; p.disabled = true; }
});

/* ---------- 遊戲框架 ---------- */
const TOTAL = 10;
const ENCOURAGE = ['再想想看～', '差一點點！', '沒關係，再試一次！', '慢慢來，你可以的！'];
const PRAISE = ['答對了！好厲害！', '太棒了！', '小睿闆是天才！', '耶！答對了！', '酷喔！'];
function startGame(kind) {
  G = { kind, i: 0, earned: 0, fresh: [], timer: null, cur: null, lock: false };
  $('#gTitle').textContent = GAMES[kind].title;
  show('game');
  GAMES[kind].setup($('#gBody'));
  nextQ();
}
function nextQ() {
  clearTimeout(G.timer);
  const total = GAMES[G.kind].total || TOTAL;
  if (G.i >= total) return finish();
  G.i++; G.lock = false;
  $('#gProg').textContent = `${G.i} / ${total}`;
  GAMES[G.kind].question();
}
function correct(o) {
  if (G.lock) return; G.lock = true;
  beep('ok'); confetti(); cheerRui();
  const st = addStar(); if (st) G.fresh.push(st);
  G.earned++;
  const sayT = typeof o === 'string' ? o : pick(PRAISE);
  if (o && o.explain) {
    const box = $('#exp');
    box.innerHTML = `<div class="know">💡 ${o.explain}</div><button class="paybtn" id="nextBtn">下一題 ➡️</button>`;
    $('#nextBtn').onclick = nextQ;
    say(sayT + '。' + box.querySelector('.know').textContent.replace(/[💡🔍✔️]/gu, ''));
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }
  if (o !== false) say(sayT);
  G.timer = setTimeout(nextQ, typeof o === 'string' ? 1900 : 1200);
}
function wrong(el) {

  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function finish() {
  cheerRui(); clearInterval(G.iv);
  const sum = GAMES[G.kind].summary?.();
  const m = openModal(`${sum || `<div class="big">🎉</div><h2>完成了！</h2><p>這次拿到 <b>${G.earned}</b> 顆 ⭐，全部有 ${S.stars} 顆！</p>`}
    ${G.fresh.length ? `<p>獲得新貼紙：<span style="font-size:44px">${G.fresh.join(' ')}</span></p>` : `<p class="small">再 ${5 - S.stars % 5} 顆星就有新貼紙！</p>`}
    <div class="mbtns"><button class="mbtn" id="again">🔁 再玩一次</button><button class="mbtn alt" id="toHome">🏠 回冒險地圖</button></div>`);
  say(G.fresh.length ? '太厲害了！你拿到新貼紙了！' : '太厲害了！完成挑戰！');

  m.querySelector('#toHome').onclick = goHome;
}
$('#gSay').onclick = () => GAMES[G.kind].read();
document.addEventListener('keydown', e => {
  if (G.kind !== 'speed' || !$('#game').classList.contains('active') || $('#mb').classList.contains('show')) return;
  if (/^[0-9]$/.test(e.key)) GAMES.speed.key(e.key); else if (e.key === 'Backspace') GAMES.speed.key('⌫'); else if (e.key === 'Enter') GAMES.speed.key('OK');
});
$('#gHint').onclick = () => {
  const g = GAMES[G.kind];
  if (g.noHint) { const m = openModal('<h2>⚡ 限時挑戰</h2><p>這一關沒有提示，靠自己的實力！</p><div class="mbtns"><button class="mbtn" id="hOk">衝啊！</button></div>'); m.querySelector('#hOk').onclick = closeModal; return; }
  const m = openModal(`<h2>🤔 小提示</h2>${g.hint()}<div class="mbtns"><button class="mbtn green" id="hOk">👍 我懂了</button><button class="mbtn pink" id="hDad">👨 還是不懂，問爸爸</button></div>`);
  m.querySelector('#hOk').onclick = () => { closeModal(); g.afterHint?.(); };

/* ---------- 共用：選擇題 ---------- */
// opts: [{html|label, val, cls}]；答對時若有 explain 就顯示「你知道嗎」並等按「下一題」
function mc({ head = '', prompt, opts, ans, explain, sayT, cls = '', onRight }) {
  const body = $('#gBody');
  body.innerHTML = `${head}${prompt ? `<div class="question small">${prompt}</div>` : ''}<div class="choices ${cls}">${opts.map((o, i) => `<button class="choice ${o.cls || ''}" data-i="${i}">${o.html ?? esc(o.label)}</button>`).join('')}</div><div class="explain" id="exp"></div>`;
  $$('#gBody .choices .choice').forEach(b => b.onclick = () => {
    if (G.lock) return;
    const o = opts[+b.dataset.i];
    if (o.val === ans) { b.classList.add('right'); onRight?.(); correct(explain ? { explain } : undefined); }
    else { wrong(b); b.disabled = true; b.classList.add('no'); }
  });
  if (sayT) say(sayT);
}
function numOpts(ans, n = 4, spread = [1, 2, 10, 3, 5, 20, 100]) {
  const s = new Set();
  for (const d of shuffle(spread.flatMap(x => [x, -x]))) { const v = ans + d; if (v >= 0 && v !== ans) s.add(v); if (s.size >= n - 1) break; }
  return shuffle([ans, ...s]).map(v => ({ label: String(v), val: v }));
}
const peek = v => `<button class="peek" data-a="${v}">看答案</button>`;

/* ---------- 數學題 ---------- */
function makeMath() {
  const g = S.grade;
  const type = g === 1 ? pick(['add', 'add', 'sub', 'sub', 'missadd', 'misssub', 'chain'])
    : g === 2 ? pick(['add3', 'sub3', 'mul', 'mul', 'missmul', 'mix', 'missadd'])
    : g === 3 ? pick(['add3', 'sub3', 'missmul', 'mix', 'mix', 'miss3', 'chain3', 'mul'])
    : pick(['add3', 'sub3', 'missmul', 'mix', 'div', 'div', 'mul2', 'mul2', 'miss3', 'chain3']);
  const r = (text, ans, kind, o = {}) => ({ text, ans, kind, ...o });
  if (type === 'add') { const a = rand(18, 68), b = rand(13, 99 - a); return r(`${a} + ${b}`, a + b, 'add', { a, b, op: '+' }); }
  if (type === 'sub') { const a = rand(31, 99), b = rand(12, a - 6); return r(`${a} − ${b}`, a - b, 'sub', { a, b, op: '−' }); }
  if (type === 'missadd') { const big = g > 1; const b = rand(6, big ? 299 : 39), c = rand(b + 8, big ? 899 : 99); return r(`□ + ${b} = ${c}`, c - b, 'missadd', { b, c }); }
  if (type === 'misssub') { const a = rand(35, 99), c = rand(6, a - 8); return r(`${a} − □ = ${c}`, a - c, 'misssub', { a, c }); }
  if (type === 'chain') { const a = rand(15, 45), b = rand(12, 40), c = rand(8, a + b - 5); return r(`${a} + ${b} − ${c}`, a + b - c, 'chain', { a, b, c }); }
  if (type === 'add3') { const a = rand(125, 650), b = rand(g >= 3 ? 160 : 38, 990 - a); return r(`${a} + ${b}`, a + b, 'add', { a, b, op: '+' }); }
  if (type === 'sub3') { const a = rand(g >= 3 ? 400 : 200, 999), b = rand(g >= 3 ? 158 : 36, a - 25); return r(`${a} − ${b}`, a - b, 'sub', { a, b, op: '−' }); }
  if (type === 'mul') { const a = rand(3, 9), b = rand(3, 9); return r(`${a} × ${b}`, a * b, 'mul', { a, b }); }
  if (type === 'missmul') { const a = rand(3, 9), b = rand(3, 9); return r(`□ × ${b} = ${a * b}`, a, 'missmul', { a, b }); }
  if (type === 'mix') {
    const a = rand(3, 9), b = rand(3, 9), plus = Math.random() < .55, c = plus ? rand(4, g >= 3 ? 60 : 25) : rand(3, a * b - 2);
    return r(`${a} × ${b} ${plus ? '+' : '−'} ${c}`, plus ? a * b + c : a * b - c, 'mix', { a, b, c, plus });
  }
  if (type === 'div') { const a = rand(3, 9), b = rand(3, 9); return r(`${a * b} ÷ ${b}`, a, 'div', { a, b }); }
  if (type === 'mul2') { const a = rand(12, 39), b = rand(2, 6); return r(`${a} × ${b}`, a * b, 'mul2', { a, b }); }
  if (type === 'miss3') { const b = rand(120, 480), c = rand(b + 120, 980); return r(`□ + ${b} = ${c}`, c - b, 'missadd', { b, c }); }
  const a = rand(150, 500), b = rand(120, 400), c = rand(100, a + b - 50);
  return r(`${a} + ${b} − ${c}`, a + b - c, 'chain', { a, b, c });
}
function mathOptions(p) {
  if (p.kind === 'missmul' || p.kind === 'div') return shuffle([p.ans, ...shuffle([p.ans + 1, p.ans - 1, p.ans + 2, p.ans - 2].filter(v => v > 0)).slice(0, 2)]);
  const s = new Set(), big = p.ans >= 100;
  const cand = shuffle([1, -1, 10, -10, 2, -2, big ? 100 : 11, big ? -100 : -9].map(d => p.ans + d));
  for (const n of cand) { if (n >= 0 && n !== p.ans) s.add(n); if (s.size === 2) break; }

const TONES = ['', 'ˊ', 'ˇ', 'ˋ'];
const CONFUSE = { 'ㄓ': 'ㄗ', 'ㄗ': 'ㄓ', 'ㄔ': 'ㄘ', 'ㄘ': 'ㄔ', 'ㄕ': 'ㄙ', 'ㄙ': 'ㄕ', 'ㄣ': 'ㄥ', 'ㄥ': 'ㄣ', 'ㄢ': 'ㄤ', 'ㄤ': 'ㄢ', 'ㄈ': 'ㄏ', 'ㄏ': 'ㄈ', 'ㄋ': 'ㄌ', 'ㄌ': 'ㄋ' };
function zhuyinVariants(z) {
  const syl = z.split(' '), out = new Set();
  for (let k = 0; k < 12 && out.size < 6; k++) {
    const i = rand(0, syl.length - 1), s = syl[i];
    if (s.startsWith('˙')) continue;
    const tone = TONES.includes(s.slice(-1)) && s.slice(-1) ? s.slice(-1) : '', base = tone ? s.slice(0, -1) : s;
    let ns;
    if (Math.random() < .5) { const t2 = pick(TONES.filter(t => t !== tone)); ns = base + t2; }
    else { const ch = [...base].find(c => CONFUSE[c]); if (!ch) continue; ns = base.replace(ch, CONFUSE[ch]) + tone; }
    const v = syl.map((x, j) => j === i ? ns : x).join(' ');
    if (v !== z) out.add(v);
  }
  return [...out];
}

const bags = {};
function draw(name, list) {
  if (!bags[name] || !bags[name].length || bags[name].grade !== S.grade) { bags[name] = shuffle(list); bags[name].grade = S.grade; }

function traceSteps(p) {
  if (p.type === 'zh') return [
    { t: `這個字是「${p.ch}」，念 ${p.z}`, sayT: `這個字是${p.ch}` },
    { t: '寫字口訣①：先上面、再下面', sayT: '先寫上面，再寫下面' },
    { t: '寫字口訣②：先左邊、再右邊；先橫、後豎', sayT: '先左邊再右邊，先寫橫，再寫豎' },
    { t: '寫字口訣③：有框框的字，先外面、再裡面，最後封口', sayT: '先寫外面，再寫裡面，最後封口' },
    { t: '沿著灰色的字慢慢描，描完再自己寫一次！💪', sayT: '沿著灰色的字慢慢描，描完再自己寫一次' }];
  if (p.word) return [
    { t: `這個單字是 ${p.word}，意思是「${p.c}」`, en: p.word },
    { t: `一個一個字母念：${[...p.word].join(' - ')}`, en: [...p.word].join(', ') },
    { t: '英文從左寫到右，字母之間不要黏在一起', sayT: '英文從左邊寫到右邊，字母之間不要黏在一起' },
    { t: '描完以後，蓋住它自己拼一次！💪', sayT: '描完以後，蓋住它自己拼一次' }];
  return [
    { t: `這是大寫 ${p.up} 和小寫 ${p.low}`, en: `${p.up}. Big ${p.up}, little ${p.low}` },
    { t: '大寫字母高高的：從最上面那條線，寫到第三條線', sayT: '大寫字母很高，從最上面的線寫到第三條線' },
    { t: '小寫字母大多矮矮的：寫在中間兩條線之間（有些會長尾巴）', sayT: '小寫字母大多寫在中間兩條線之間' },
    { t: '從上往下、從左往右描，描完自己寫一次！💪', sayT: '從上往下，從左往右描，描完自己寫一次' }];
}
function drawHint() {
  hctx.clearRect(0, 0, W, H);
  const p = B.problem; if (!p || p.type !== 'vert' || B.step < 0) return;
  const g = vertGeom(), cur = B.steps[B.step];
  if (cur.col != null) { hctx.fillStyle = 'rgba(255,217,61,.32)'; const x = g.x(cur.col); hctx.fillRect(x - g.fs * .42, g.r1 - g.fs * .95, g.fs * .84, g.ans - g.r1 + g.fs * 1.4); }
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  const sets = {};
  for (let i = 0; i <= B.step; i++) for (const m of B.steps[i].marks) {
    if (m.k === 'ans') { hctx.fillStyle = '#2ecc71'; hctx.font = `900 ${g.fs}px "Avenir Next",sans-serif`; hctx.fillText(m.d, g.x(m.col), g.ans); }
    if (m.k === 'carry') { hctx.fillStyle = '#ff5e57'; hctx.font = `900 ${g.fs * .45}px sans-serif`; hctx.fillText('1', g.x(m.col), g.r1 - g.fs * .78); }
    if (m.k === 'set') sets[m.col] = m.v;
  }
  for (const [c, v] of Object.entries(sets)) {
    const x = g.x(+c);
    hctx.strokeStyle = '#ff5e57'; hctx.lineWidth = 4; hctx.beginPath(); hctx.moveTo(x - g.fs * .3, g.r1 + g.fs * .3); hctx.lineTo(x + g.fs * .3, g.r1 - g.fs * .3); hctx.stroke();
    hctx.fillStyle = '#ff5e57'; hctx.font = `900 ${g.fs * .42}px sans-serif`; hctx.fillText(v, x, g.r1 - g.fs * .78);
  }
}
function showStep() {
  const s = B.steps[B.step];
  $('#hintText').textContent = s.t;
  $('#hPrev').style.visibility = B.step > 0 ? 'visible' : 'hidden';
  $('#hNext').textContent = B.step < B.steps.length - 1 ? '下一步 ➡️' : '完成 👍';
  if (s.en) sayEn(s.en); else say(s.sayT || s.t.replace(/[🎉💪]/g, ''));
  drawHint();
}
function startHint() { B.steps = B.problem.type === 'vert' ? vertSteps(B.problem) : traceSteps(B.problem); B.step = 0; $('#hintPanel').classList.add('show'); showStep(); }
function closeHint() { B.step = -1; $('#hintPanel').classList.remove('show'); drawHint(); }
$('#hNext').onclick = () => { if (B.step < B.steps.length - 1) { B.step++; showStep(); } else { closeHint(); cheerRui(); beep('ok'); } };
$('#hPrev').onclick = () => { if (B.step > 0) { B.step--; showStep(); } };
$('#hClose').onclick = closeHint;
$('#bAsk').onclick = () => {
  const p = B.problem;
  const how = !p ? '' : p.type === 'vert' ? '<button class="mbtn" id="aHow">📐 這題怎麼算？</button>' : '<button class="mbtn" id="aHow">✍️ 這個字怎麼寫？</button>';
  const m = openModal(`<h2>🙋 你想問什麼？</h2><div class="mbtns">${how}<button class="mbtn pink" id="aDad">👨 問爸爸</button></div>
    <p class="small" style="margin-top:14px">${p ? '' : '先按「📝 出題」，小小柒就能一步一步教你。<br>'}其他問題（像是「為什麼天空是藍色的？」）就問爸爸吧！</p>`);
  m.querySelector('#aHow')?.addEventListener('click', () => { closeModal(); startHint(); });
  m.querySelector('#aDad').onclick = () => openAsk({ text: '', withBoard: true });
};
function boardSnapshot() {
  return new Promise(res => {
    const sc = Math.min(1, 1200 / Math.max(bg.width, bg.height, 1));
    const c = document.createElement('canvas'); c.width = Math.round(bg.width * sc); c.height = Math.round(bg.height * sc);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bg, 0, 0, c.width, c.height); x.drawImage(ink, 0, 0, c.width, c.height);
    c.toBlob(b => res(b), 'image/jpeg', .82);
  });
}

/* ---------- 問題信箱（存在這台裝置的 IndexedDB） ---------- */
const idb = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('xr-learn', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' }); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('q', mode); const req = fn(t.objectStore('q')); t.oncomplete = () => res(req?.result); t.onerror = () => rej(t.error); }); },
  all() { return this.run('readonly', s => s.getAll()); },
  put(o) { return this.run('readwrite', s => s.put(o)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); }
};
function setupRecorder(btn, info, audio, onBlob) {
  let mr = null, iv = null, stream = null;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { btn.hidden = true; info.textContent = '這台裝置不能錄音，可以打字或直接送出。'; return { stop() {} }; }
  btn.onclick = async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { info.textContent = '沒辦法用麥克風（要允許麥克風，或用 https 網址開）。可以打字或直接送出。'; return; }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const chunks = []; mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      clearInterval(iv); stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mr.mimeType || type || 'audio/mp4' });
      audio.src = URL.createObjectURL(blob); audio.hidden = false;
      btn.textContent = '🎤 重新錄'; btn.classList.remove('recording'); info.textContent = '錄好了！可以先聽聽看'; onBlob(blob);
    };
    mr.start(); const t0 = Date.now(); btn.textContent = '⏹️ 說完了'; btn.classList.add('recording');
    iv = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); info.textContent = `錄音中… ${s} 秒（最多 60 秒）`; if (s >= 60) mr.stop(); }, 250);
  };
  return { stop() { if (mr && mr.state === 'recording') mr.stop(); } };
}
function openAsk({ text, withBoard }) {
  let audioBlob = null;
  const m = openModal(`<h2>👨 問爸爸</h2><p>按下麥克風，把你的問題說出來！</p>
    <button class="mic" id="rec">🎤 開始說</button><p class="small" id="recInfo"></p><audio id="recPlay" controls hidden></audio>
    <textarea id="askText" rows="2" placeholder="也可以請大人幫忙打字（可以不填）">${esc(text)}</textarea>
    ${withBoard ? '<p class="small">📷 會一起附上現在的白板畫面</p>' : ''}
    <div class="mbtns"><button class="mbtn pink" id="askSend">📮 放進問題信箱</button><button class="mbtn alt" id="askCancel">取消</button></div>`);
  curRec = setupRecorder(m.querySelector('#rec'), m.querySelector('#recInfo'), m.querySelector('#recPlay'), b => audioBlob = b);
  m.querySelector('#askCancel').onclick = closeModal;
  m.querySelector('#askSend').onclick = async () => {
    curRec?.stop(); await new Promise(r => setTimeout(r, 300));
    const q = { id: Date.now(), at: Date.now(), text: m.querySelector('#askText').value.trim(), audio: audioBlob, img: withBoard ? await boardSnapshot() : null, answerText: '', answerAudio: null, answeredAt: 0 };
    if (!q.text && !q.audio && !q.img) { m.querySelector('#recInfo').textContent = '先說說看或打字喔！'; return; }
    try { await idb.put(q); } catch (e) { alert('存不進去：' + e.message); return; }
    curRec = null; afterAsk(q);
  };
}
function afterAsk(q) {
  cheerRui(); say('問題放進信箱了！爸爸會回答你喔！');
  const files = [];
  if (q.img) files.push(new File([q.img], '小睿闆的白板.jpg', { type: 'image/jpeg' }));
  if (q.audio) files.push(new File([q.audio], '小睿闆的問題.' + (q.audio.type.includes('webm') ? 'webm' : 'm4a'), { type: q.audio.type }));
  const canShare = files.length && navigator.canShare && navigator.canShare({ files });
  const m = openModal(`<div class="big">📮</div><h2>放進問題信箱了！</h2><p>爸爸回答以後，首頁的「問題信箱」會亮紅點喔！</p>
    <div class="mbtns">${canShare ? '<button class="mbtn green" id="shareNow">📤 現在傳給爸爸（LINE）</button>' : ''}<button class="mbtn alt" id="okAsk">好～</button></div>`);
  m.querySelector('#okAsk').onclick = closeModal;
  m.querySelector('#shareNow')?.addEventListener('click', async () => {
    try { await navigator.share({ files, text: `小睿闆問爸爸：${q.text || '（請聽錄音／看白板）'}` }); } catch (e) {}
  });
}
let dadMode = false, mailUrls = [];
async function updateMailBadge() {
  try { const n = (await idb.all()).filter(q => q.answeredAt > S.mailSeen).length; const b = $('#mailBadge'); b.textContent = n; b.classList.toggle('show', n > 0); } catch (e) {}
}
async function openMail() {
  dadMode = false; $('#dadBtn').textContent = '🔒 我是爸爸';
  show('mail'); await renderMail();
  const all = await idb.all();
  if (all.some(q => q.answeredAt > S.mailSeen)) { say('爸爸回答你的問題了！'); cheerRui(); }
  S.mailSeen = Date.now(); save();
}
const url = b => { const u = URL.createObjectURL(b); mailUrls.push(u); return u; };
const fmt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
async function renderMail() {
  mailUrls.forEach(u => URL.revokeObjectURL(u)); mailUrls = [];
  const list = (await idb.all()).sort((a, b) => b.at - a.at);
  const box = $('#mailList');
  if (!list.length) { box.innerHTML = `<div class="empty">信箱還是空的～<br>在白板按「🙋 我有問題」→「問爸爸」<br>就可以把問題放進來！</div>`; return; }
  box.innerHTML = list.map(q => `<div class="mcard" data-id="${q.id}">
    <div class="when">🙋 ${fmt(q.at)} 小睿闆問：${q.answeredAt ? '　✅ 已回答' : '　⏳ 等爸爸回答'}</div>
    ${q.text ? `<div class="qtext">${esc(q.text)}</div>` : ''}
    ${q.audio ? `<audio controls src="${url(q.audio)}"></audio>` : ''}
    ${q.img ? `<img src="${url(q.img)}" alt="白板" class="zm">` : ''}
    ${q.answeredAt ? `<div class="answer"><b>👨 爸爸說：</b>${esc(q.answerText) || ''}${q.answerAudio ? `<br><audio controls src="${url(q.answerAudio)}"></audio>` : ''}</div>` : ''}
    ${dadMode ? `<div class="dadbox"><textarea rows="2" class="atext" placeholder="打字回答小睿闆">${esc(q.answerText)}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="mic arec" style="font-size:17px;padding:10px 16px">🎤 錄音回答</button><span class="small ainfo"></span></div>
      <audio class="aplay" controls hidden></audio>
      <button class="mbtn green asave">💾 儲存回答</button><button class="mbtn red adel">🗑️ 刪除這題</button></div>` : ''}
  </div>`).join('');
  box.querySelectorAll('.zm').forEach(i => i.onclick = () => { const m = openModal(`<img class="zoomimg" src="${i.src}"><div class="mbtns"><button class="mbtn alt" id="zc">關閉</button></div>`); m.querySelector('#zc').onclick = closeModal; });
  if (!dadMode) return;
  box.querySelectorAll('.mcard').forEach(card => {
    const q = list.find(x => x.id === +card.dataset.id); let ans = null;
    const rec = setupRecorder(card.querySelector('.arec'), card.querySelector('.ainfo'), card.querySelector('.aplay'), b => ans = b);
    card.querySelector('.asave').onclick = async () => {
      rec.stop(); await new Promise(r => setTimeout(r, 300));
      q.answerText = card.querySelector('.atext').value.trim(); if (ans) q.answerAudio = ans;
      if (!q.answerText && !q.answerAudio) { card.querySelector('.ainfo').textContent = '先打字或錄音喔'; return; }
      q.answeredAt = Date.now(); await idb.put(q); renderMail();
    };
    card.querySelector('.adel').onclick = async () => { if (confirm('確定刪除這個問題嗎？刪掉就找不回來了。')) { await idb.del(q.id); renderMail(); } };
  });
}
$('#dadBtn').onclick = () => {
  if (dadMode) { dadMode = false; $('#dadBtn').textContent = '🔒 我是爸爸'; renderMail(); return; }
  const a = rand(6, 9), b = rand(6, 9);
  const m = openModal(`<h2>🔒 大人確認</h2><p>請回答：${a} × ${b} = ?</p><input type="number" inputmode="numeric" id="gate"><div class="mbtns"><button class="mbtn" id="gOk">進入爸爸模式</button><button class="mbtn alt" id="gNo">取消</button></div>`);
  m.querySelector('#gNo').onclick = closeModal;
  m.querySelector('#gOk').onclick = () => {
    if (+m.querySelector('#gate').value === a * b) { dadMode = true; $('#dadBtn').textContent = '🔓 離開爸爸模式'; closeModal(); renderMail(); }
    else m.querySelector('#gate').value = '';
  };
};

/* ---------- 貼紙本 ---------- */
function openStickers() {
  show('stickers');
  $('#stkGrid').innerHTML = STICKERS.map((s, i) => i < S.stickers ? `<div class="stk">${s}</div>` : `<div class="stk lock">${(i + 1) * 5}⭐</div>`).join('');
  $('#stkNext').textContent = S.stickers >= STICKERS.length ? '全部收集完成了！小睿闆超強！🏆' : `再 ${5 - S.stars % 5} 顆星，就能拿到下一張貼紙！`;
}

/* ---------- 開始 ---------- */
const hr = new Date().getHours();
$('#greet').firstChild.textContent = (hr < 11 ? '早安' : hr < 18 ? '午安' : '晚安') + '，小睿闆！今天想玩什麼？';
paintGrade(); paintStars(); updateMailBadge();
</script>
